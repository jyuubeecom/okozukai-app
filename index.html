<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ef9b32"
  >

  <title>おこづかいメモ</title>

  <link
    rel="stylesheet"
    href="./style.css?v=0.10.1"
  >

  <link
    rel="manifest"
    href="./manifest.json?v=0.10.1"
  >
</head>

<body>

  <main class="app">

    <h1>おこづかいメモ</h1>

    <p class="app-version">
      Ver. 0.10.1 ｜ 2026/08/15
    </p>

    <section class="wallet-balance">

      <p>
        いま持っているお金
      </p>

      <strong id="wallet-balance-total">
        0円
      </strong>

    </section>

    <section class="summary">

      <h2 id="summary-title">
        今月のまとめ
      </h2>

      <p>
        もらった金額：
        <strong id="received-total">
          0円
        </strong>
      </p>

      <p>
        つかった金額：
        <strong id="spent-total">
          0円
        </strong>
      </p>

      <p>
        今月の予算：
        <strong id="budget-total">
          0円
        </strong>
      </p>

      <p>
        あと使える金額：
        <strong id="remaining-budget-total">
          0円
        </strong>
      </p>

      <p
        id="budget-message"
        class="budget-message"
      >
        予算を設定してみよう
      </p>

      <p>
        のこり：
        <strong id="balance-total">
          0円
        </strong>
      </p>

    </section>

    <section class="month-area">

      <label for="month-select">
        表示する月
      </label>

      <input
        id="month-select"
        type="month"
      >

    </section>

    <section class="budget-area">

      <h2>
        今月の予算設定
      </h2>

      <label for="budget-amount">
        今月使ってよい金額
      </label>

      <input
        id="budget-amount"
        type="number"
        min="0"
        placeholder="例：1000"
      >

      <button id="save-budget-button">
        予算を保存する
      </button>

    </section>

    <section class="chore-settings">

      <h2>
        お手伝い設定
      </h2>

      <label for="chore-name">
        お手伝いの名前
      </label>

      <input
        id="chore-name"
        type="text"
        placeholder="例：洗たくものをたたむ"
      >

      <label for="chore-amount">
        もらえる金額
      </label>

      <input
        id="chore-amount"
        type="number"
        min="1"
        placeholder="例：80"
      >

      <button id="add-chore-button">
        お手伝いを追加する
      </button>

      <ul id="chore-settings-list"></ul>

    </section>

    <section class="input-area">

      <h2>
        お手伝いを記録する
      </h2>

      <label for="chore-select">
        お手伝いした内容
      </label>

      <select id="chore-select">
        <option value="">
          お手伝いを選んでください
        </option>
      </select>

      <label for="amount">
        もらえる金額
      </label>

      <input
        id="amount"
        type="number"
        readonly
        placeholder="お手伝いを選ぶと表示されます"
      >

      <label for="chore-date">
        お手伝いした日
      </label>

      <input
        id="chore-date"
        type="date"
      >

      <button id="record-button">
        記録する
      </button>

    </section>

    <section class="expense-area">

      <h2>
        使ったお金を記録する
      </h2>

      <label for="expense-amount">
        金額
      </label>

      <input
        id="expense-amount"
        type="number"
        min="1"
        placeholder="例：120"
      >

      <label for="expense-content">
        使った内容
      </label>

      <input
        id="expense-content"
        type="text"
        placeholder="例：ジュース"
      >

      <label for="expense-category">
        カテゴリ
      </label>

      <select id="expense-category">

        <option value="">
          カテゴリを選んでください
        </option>

        <option value="おかし">
          おかし
        </option>

        <option value="文房具">
          文房具
        </option>

        <option value="ゲーム">
          ゲーム
        </option>

        <option value="貯金">
          貯金
        </option>

        <option value="その他">
          その他
        </option>

      </select>

      <label for="expense-date">
        使った日
      </label>

      <input
        id="expense-date"
        type="date"
      >

      <button id="expense-button">
        支出を記録する
      </button>

    </section>

    <section class="category-summary">

      <h2>
        カテゴリ別の支出
      </h2>

      <ul id="category-summary-list"></ul>

    </section>

    <section class="data-area">

      <h2>
        データ管理
      </h2>

      <p class="data-description">
        記録や設定をファイルに保存できます。
      </p>

      <button id="export-data-button">
        データを書き出す
      </button>

      <label
        for="import-data-input"
        class="import-data-label"
      >
        データを読み込む
      </label>

      <input
        id="import-data-input"
        type="file"
        accept=".json,application/json"
      >

    </section>

    <section class="records">

      <h2>
        記録一覧
      </h2>

      <ul id="record-list"></ul>

    </section>

  </main>

  <!-- 記録編集画面 -->
  <div
    id="edit-record-modal"
    class="edit-modal is-hidden"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-modal-title"
  >

    <div class="edit-modal-card">

      <h2 id="edit-modal-title">
        記録を編集
      </h2>

      <label for="edit-record-amount">
        金額
      </label>

      <input
        id="edit-record-amount"
        type="number"
        min="1"
      >

      <label for="edit-record-content">
        内容
      </label>

      <input
        id="edit-record-content"
        type="text"
      >

      <div id="edit-category-area">

        <label for="edit-record-category">
          カテゴリ
        </label>

        <select id="edit-record-category">

          <option value="おかし">
            おかし
          </option>

          <option value="文房具">
            文房具
          </option>

          <option value="ゲーム">
            ゲーム
          </option>

          <option value="貯金">
            貯金
          </option>

          <option value="その他">
            その他
          </option>

        </select>

      </div>

      <label for="edit-record-date">
        日付
      </label>

      <input
        id="edit-record-date"
        type="date"
      >

      <div class="edit-modal-buttons">

        <button
          id="save-edit-button"
          type="button"
        >
          変更を保存
        </button>

        <button
          id="cancel-edit-button"
          type="button"
        >
          キャンセル
        </button>

      </div>

    </div>

  </div>

  <script src="./script.js?v=0.10.1"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        async function () {
          try {
            const registration =
              await navigator.serviceWorker.register(
                "./service-worker.js?v=0.10.1",
                {
                  updateViaCache: "none"
                }
              );

            registration.update();
          } catch (error) {
            console.error(
              "Service Workerの登録に失敗しました",
              error
            );
          }
        }
      );
    }
  </script>

</body>

</html>
